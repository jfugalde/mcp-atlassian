extends: theme-check:recommended

# Run Theme Check with this folder as cwd (theme root: config/, snippets/, locales/, …).
# From repo root:  shopify theme check --path Farmacia_Macross/theme
# Wrong cwd → bogus MissingTemplate and scans of vendor/skeleton-reference, RYU-Website, etc.

# Minimog ships multilingual maps for settings_schema "name", "label", "content", etc.
# Theme Check ValidJSON expects Shopify's English-only string schema — re-enable after a full schema migration.
ValidJSON:
  enabled: false

# Many locale JSON files lag keys present in en.default.json (Macross strings, cart, pickup, …).
MatchingTranslations:
  enabled: false

# Dynamic renders / app snippets / legacy section JSON — high false-positive rate on Minimog forks.
MissingTemplate:
  enabled: false
ValidSchema:
  enabled: false
UnknownFilter:
  enabled: false
LiquidHTMLSyntaxError:
  enabled: false
TranslationKeyExists:
  enabled: false
